  <!-- ============================================================
       Viewer — a native dialog: focus is held inside it, Escape
       closes it, and focus returns to the piece that opened it.
       ============================================================ -->
  <dialog class="vz-viewer" aria-label="Image viewer">
    <div class="vz-viewer__bar vz-viewer__bar--top">
      <span class="ex-annot vz-viewer__count" aria-live="polite"></span>
      <button class="ex-link" type="button" data-close>Close</button>
    </div>

    <div class="vz-viewer__stage" data-close>
      <img class="vz-viewer__img" alt="" sizes="100vw">
    </div>

    <div class="vz-viewer__bar vz-viewer__bar--bottom">
      <button class="ex-link" type="button" data-step="-1">Previous</button>
      <button class="ex-link" type="button" data-step="1">Next</button>
    </div>
  </dialog>

  <script src="../js/museum.js"></script>
  <script>
    (() => {
      const pieces = [...document.querySelectorAll('.vz-piece')]
        .sort((a, b) => a.dataset.index - b.dataset.index);
      const viewer = document.querySelector('.vz-viewer');
      const img = viewer.querySelector('.vz-viewer__img');
      const count = viewer.querySelector('.vz-viewer__count');
      const pad = (n) => String(n).padStart(2, '0');
      let at = 0;

      const show = (i) => {
        at = (i + pieces.length) % pieces.length;
        const piece = pieces[at];
        const thumb = piece.querySelector('img');

        img.classList.add('is-loading');
        img.onload = () => img.classList.remove('is-loading');
        img.srcset = piece.dataset.full;
        img.src = thumb.currentSrc || thumb.src;
        img.alt = thumb.alt;
        if (img.complete) img.classList.remove('is-loading');

        count.textContent = pad(at + 1) + ' / ' + pad(pieces.length);
      };

      pieces.forEach((piece, i) => {
        piece.addEventListener('click', () => {
          show(i);
          viewer.showModal();
        });
      });

      viewer.addEventListener('click', (e) => {
        const step = e.target.closest('[data-step]');
        if (step) return show(at + Number(step.dataset.step));
        if (e.target.closest('[data-close]') && e.target !== img) viewer.close();
      });

      viewer.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') show(at + 1);
        if (e.key === 'ArrowLeft') show(at - 1);
      });

      /* Swipe between pieces on touch screens. */
      let x0 = null;
      viewer.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
      viewer.addEventListener('touchend', (e) => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 48) show(at + (dx < 0 ? 1 : -1));
        x0 = null;
      });
    })();
  </script>
