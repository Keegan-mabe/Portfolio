<!DOCTYPE html>
<html lang="en" data-theme="museum">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keegan O'Neill — Industrial &amp; Product Design</title>
  <meta name="description" content="Selected product, industrial, and brand design work by Keegan O'Neill.">
  <link rel="stylesheet" href="css/museum.css">
  <script>
    /* Dev theme switch — ?theme=classic opens the previous homepage. */
    if (new URLSearchParams(location.search).get('theme') === 'classic') {
      location.replace('index-legacy.html');
    }
  </script>
  <style>
    /* Focal points now travel with each record in data/projects.js; the
       working drawing and its treatment live in the theme. */
  </style>
</head>
<body>

  <!-- ============================================================
       Navigation
       ============================================================ -->
  <nav class="ex-nav">
    <div class="ex-nav__inner">
      <a href="index.html" class="ex-nav__mark">K.O.</a>

      <button class="ex-nav__toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>

      <ul class="ex-nav__links">
        <li><a href="projects/index.html" class="ex-nav__link">Products</a></li>
        <li><a href="ux/index.html" class="ex-nav__link">UX</a></li>
        <li><a href="about/index.html" class="ex-nav__link">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- ============================================================
       Landing — one mid-scale element, everything else small.
       Stops short of the fold so the grid below shows itself.
       ============================================================ -->
  <header class="ex-landing">

    <div class="ex-landing__bg" aria-hidden="true">
      <img src="PortBG.png" alt="">
    </div>

    <div></div>

    <div class="ex-shell ex-landing__block">

      <div class="ex-landing__top">
        <span class="ex-annot ex-annot--ink ex-settle ex-settle--1">Keegan O&rsquo;Neill</span>
      </div>

      <h1 class="ex-cycle">
        <span class="ex-cycle__word" aria-hidden="true">UX</span>
        <span class="ex-cycle__word" aria-hidden="true">Interface</span>
        <span class="ex-cycle__word" aria-hidden="true">Fashion</span>
        <span class="ex-cycle__word" aria-hidden="true">Web</span>
        <span class="ex-cycle__word" aria-hidden="true">Experience</span>
        <span class="ex-cycle__word" aria-hidden="true">UI</span>
        <span class="ex-cycle__word" aria-hidden="true">Product</span><!--
        --><span class="ex-cycle__final"><span class="ex-cycle__reveal"><span>Design</span></span><i class="ex-cycle__stop" aria-hidden="true"></i></span>
      </h1>

      <hr class="ex-rule ex-landing__rule ex-settle ex-settle--3">

      <p class="ex-copy ex-settle ex-settle--3">
        Industrial designer working across physical products and digital experiences.
      </p>

    </div>

    <div class="ex-shell">
      <div class="ex-landing__foot">
        <span class="ex-cue ex-settle ex-settle--4" aria-hidden="true"></span>
      </div>
    </div>

  </header>

  <main>

    <!-- ========================================================
         Work — two columns, one gutter, one ratio. The closing
         work spans both because the panorama needs the width.
         ======================================================== -->
    <section class="ex-work">
      <div class="ex-shell">

        <div class="ex-head">
          <span class="ex-annot ex-annot--ink">Selected work</span>
        </div>

        <div class="ex-work__grid" data-projects data-base="" data-wide="05" data-featured="06" data-priority="01" data-numbers="off"></div>

      </div>
    </section>

    <!-- ========================================================
         Onward
         ======================================================== -->
    <section class="ex-shell">
      <div class="ex-onward">
        <a href="projects/index.html" class="ex-link">
          All products <span class="ex-link__cue" aria-hidden="true">&rarr;</span>
        </a>
        <a href="ux/index.html" class="ex-link">
          UX <span class="ex-link__cue" aria-hidden="true">&rarr;</span>
        </a>
        <a href="about/index.html" class="ex-link">
          About <span class="ex-link__cue" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </section>

  </main>

  <!-- ============================================================
       Footer
       ============================================================ -->
  <footer class="ex-foot">
    <div class="ex-shell ex-foot__inner">
      <span class="ex-annot ex-annot--ink">Keegan O&rsquo;Neill</span>
      <span class="ex-annot">Industrial &amp; product design</span>
      <span class="ex-annot">2026</span>
    </div>
  </footer>

  <script src="data/stark-drawing.js"></script>
  <script src="data/projects.js"></script>
  <script src="js/museum.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
